<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Global Travel Market Insight</title>
<!-- 改用echarts4.9，自带world地图 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
<style>
body{
margin:0;
background:#F7F5F0;
font-family:"Microsoft YaHei";
}
#main{
width:1400px;
height:900px;
margin: auto;
}
</style>
</head>
<body>
<div id="main"></div>
<script>
let chart = echarts.init(document.getElementById("main"));

let countryData=[
{name:"China",value:120},
{name:"United States",value:95},
{name:"France",value:85},
{name:"Japan",value:70},
{name:"Italy",value:60},
{name:"Australia",value:45},
{name:"Canada",value:40},
{name:"Germany",value:35}
];
let cityData=[
["Paris",85],
["Tokyo",75],
["London",65],
["Dubai",55],
["New York",50],
["Rome",45],
["Sydney",40],
["Bangkok",35]
];
let costData=[
["France",5200],
["Japan",4800],
["United States",4500],
["Italy",3900],
["Thailand",2600]
];
let option={
backgroundColor:"#F7F5F0",
title:[
{
text:"Global Travel Market Insight",
left:"center",
top:20,
textStyle:{
fontSize:28,
color:"#4B4B4B",
fontWeight:"bold"
}
},
{
text:"旅游市场偏好与游客消费特征分析",
left:"center",
top:65,
textStyle:{
fontSize:15,
color:"#888"
}
}
],
grid:[
{
left:"55%",
top:170,
width:"35%",
height:280
},
{
left:"55%",
top:520,
width:"35%",
height:230
}
],
geo:{
map:"world",
roam:true,
left:30,
top:130,
width:"45%",
height:500,
itemStyle:{
areaColor:"#E8E3D9",
borderColor:"#FFFFFF"
},
emphasis:{
itemStyle:{
areaColor:"#A8B8A0"
}
}
},
tooltip:{trigger:"item"},
visualMap:{
min:0,
max:120,
left:40,
bottom:80,
text:["高","低"],
inRange:{
color:["#E8E3D9","#B7C7D6","#8FAFC4"]
}
},
xAxis:[
{type:"value",gridIndex:0},
{type:"value",gridIndex:1}
],
yAxis:[
{type:"category",gridIndex:0,data:cityData.map(i=>i[0]),axisLabel:{color:"#555"}},
{type:"category",gridIndex:1,data:costData.map(i=>i[0]),axisLabel:{color:"#555"}}
],
series:[
{type:"map",map:"world",geoIndex:0,data:countryData},
{name:"热门目的地",type:"bar",xAxisIndex:0,yAxisIndex:0,data:cityData.map(i=>i[1]),barWidth:18,itemStyle:{color:"#A8B8A0"}},
{name:"平均消费",type:"bar",xAxisIndex:1,yAxisIndex:1,data:costData.map(i=>i[1]),barWidth:18,itemStyle:{color:"#C8B6A6"}}
]
};
chart.setOption(option);
</script>
</body>
</html>
